name: Stack

# A real Home Assistant with the app in demo mode: config flow, entities, commands, permissions,
# app API and the dashboard in a browser. On every pull request (Dependabot updates included)
# against the stable Home Assistant, every night also against the beta.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stack:
    name: Home Assistant ${{ matrix.ha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ha: ${{ github.event_name == 'schedule' && fromJSON('["stable", "beta"]') || fromJSON('["stable"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r .github/requirements/e2e.txt && python -m playwright install --with-deps chromium
      - name: Build the app image
        run: docker build -t lmgw-e2e-gateway addon
      - name: Run the stack test
        env:
          HA_TAG: ${{ matrix.ha }}
        run: python e2e/run.py
      - name: Screenshots and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stack-${{ matrix.ha }}
          path: |
            e2e/work/*.png
            e2e/work/*.log
          retention-days: 14
