name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove account names, VINs, plates and locations from logs before posting.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.13.5"
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant and HAOS version
      placeholder: "Core 2026.10.0, OS 18.3"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Car model
      placeholder: "T03"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: App log (Settings > Apps > Leapmotor Gateway > Log)
      render: text
